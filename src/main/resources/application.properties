spring.application.name=geolocalizacion

# ==========================================
# CONEXION A SUPABASE VIA VARIABLES DE ENTORNO
# (Las credenciales NO se suben al repositorio)
# ==========================================
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
# ==========================================
# DESCIFRADO DEL RUN QUE ENVIA EL APK
# ==========================================
# El APK guarda en su sesion el ciphertext que devolvio el backend y lo manda
# tal cual. Para convertirlo a RUN (y luego hashearlo) este servicio necesita
# las MISMAS claves que hydra_arm_security, que es quien lo cifro.
# Si no coinciden, el POST responde 400 y no se guarda nada.
app.crypto.password=${APP_CRYPTO_PASSWORD}
app.crypto.salt=${APP_CRYPTO_SALT}

server.port=${PORT:8082}